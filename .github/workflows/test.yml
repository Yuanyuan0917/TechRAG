name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      LLM_API_KEY: ""
      QDRANT_URL: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            docker/requirements-api.txt
            docker/requirements-frontend.txt
            .github/workflows/test.yml

      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run full test suite without network access
        # Unix sockets are needed by asyncio/TestClient; IP sockets stay blocked.
        run: python -m pytest --disable-socket --allow-unix-socket

      - name: Compile Python sources
        run: python -m compileall -q app scripts frontend tests

      - name: Check whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi
          git diff --check

      - name: Check workflow YAML syntax
        run: |
          python -c "from pathlib import Path; import yaml; yaml.safe_load(Path('.github/workflows/test.yml').read_text())"

      - name: Validate Docker Compose configuration
        # Use checked-in, non-secret defaults; do not start services or index data.
        run: docker compose --env-file .env.example config --quiet
